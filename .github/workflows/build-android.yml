name: Build Laurie Square Mobile POS (Sandbox)
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Validate register JavaScript and element IDs
        shell: bash
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/favorite-groups.js
          node --check app/src/main/assets/modifier-groups.js
          node --check app/src/main/assets/register-cart.js
          node --check app/src/main/assets/register-grid.js
          node scripts/test-register-grid.cjs
          node --check app/src/main/assets/settings-addons.js
          node --check app/src/main/assets/settings-addons-ui.js
          node scripts/test-settings-addons.cjs
          node --check app/src/main/assets/operations-model.js
          node --check app/src/main/assets/operations-ui.js
          node --check app/src/main/assets/checkout-charges.js
          node scripts/test-checkout-charges.cjs
          node scripts/test-operations.cjs
          node scripts/test-operations-ui.cjs
          node scripts/test-register-cart.cjs
          node scripts/test-register-layout.cjs
          node scripts/test-modifier-groups.cjs
          node scripts/test-favorite-groups.cjs
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class IDs(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]
              def handle_starttag(self,tag,attrs):
                  for key,value in attrs:
                      if key=='id': self.ids.append(value)
          p=IDs(); p.feed(Path('app/src/main/assets/index.html').read_text())
          assert len(p.ids)==len(set(p.ids)), 'Duplicate HTML IDs found'
          required={'checkout','productGrid','dialog','registerTabs','keypadPanel','bottomNav','cartList','squareConnect','readerSettings'}
          assert required.issubset(set(p.ids)), 'Missing register elements: '+str(required-set(p.ids))
          print('Register assets passed validation')
          PY
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate preinstalled Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found under $SDK_ROOT."
            find "$SDK_ROOT" -maxdepth 3 -type d 2>/dev/null | head -70 || true
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER"
          "$SDKMANAGER" --version
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate Sandbox Application ID secret
        env:
          SQUARE_SANDBOX_APP_ID: ${{ secrets.SQUARE_SANDBOX_APP_ID }}
        shell: bash
        run: |
          if [ -z "$SQUARE_SANDBOX_APP_ID" ]; then
            echo "::error::Missing SQUARE_SANDBOX_APP_ID: add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          case "$SQUARE_SANDBOX_APP_ID" in
            sandbox-*) echo "Sandbox Application ID provided." ;;
            *) echo "::error::The configured Application ID does not look like a Square Sandbox ID."; exit 1 ;;
          esac

      - name: Compile Sandbox APK
        env:
          SQUARE_SANDBOX_APP_ID: ${{ secrets.SQUARE_SANDBOX_APP_ID }}
        run: |
          gradle --no-daemon :app:assembleDebug -PsquareSandboxAppId="$SQUARE_SANDBOX_APP_ID"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lauries-Creations-Square-Sandbox-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Sandbox pre-release APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v1.10.0-sandbox"
          asset="Lauries-Creations-POS-v1.10.0-Sandbox.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "/tmp/$asset"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving the existing downloadable APK."
          else
            gh release create "$tag" "/tmp/$asset" \
              --target "$GITHUB_SHA" \
              --title "Laurie's Creations POS v1.10 — Settings & Add-ons" \
              --notes "SANDBOX TEST VERSION — not for real payments. Adds comprehensive Settings & Add-ons directory (55 entries) across checkout, items, devices, staff, customers, payments and business. Five device-local preferences are genuinely editable and persist in backups. Existing features open their working local editors. Square account/subscription/hardware features are visibly labeled as needing separate integrations; no fake activation. Keeps no tax, card-only Gratuity, and Sandbox-only card testing. Existing local Favorites, modifiers, inventory, no-tax and card-only Gratuity settings remain. The app is independently branded and supports Sandbox test payments only. No live Square catalog sync. Separate service charges can apply to both. Checkout and preview show payment-method-specific totals, cash quick amounts exclude Gratuity, and tests validate local ledger and Sandbox base amounts. Required card-only fees may be regulated as surcharges; do not use for live payments. v1.7 features retained. Live Banking and Payment Links require a secure Square API backend and are not connected. Second-device display requires a relay. Local cash is not synced to Square. Retains Square-inspired checkout. Previous Favorites, modifiers, products, device-local settings and Sandbox mock payments are retained. This is an independently branded Laurie’s Creations app, not official Square POS. No live Square Catalog sync or real payments. Includes previous saved item catalog and Square Sandbox setup diagnostics. Favorites and products are saved locally and do not sync with Square. Sandbox only; not real payments. Android 9 or newer required. This is a debug-signed APK; installation over older builds may fail if their signatures differ. Back up locally edited products and flavors before uninstalling." \
              --prerelease
          fi
          echo "Download release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
