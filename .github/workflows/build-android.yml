name: Build Laurie Square Mobile POS (Sandbox)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate preinstalled Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found under $SDK_ROOT."
            find "$SDK_ROOT" -maxdepth 3 -type d 2>/dev/null | head -70 || true
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER"
          "$SDKMANAGER" --version
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate Sandbox Application ID secret
        env:
          SQUARE_SANDBOX_APP_ID: ${{ secrets.SQUARE_SANDBOX_APP_ID }}
        shell: bash
        run: |
          if [ -z "$SQUARE_SANDBOX_APP_ID" ]; then
            echo "::error::Missing SQUARE_SANDBOX_APP_ID: add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          case "$SQUARE_SANDBOX_APP_ID" in
            sandbox-*) echo "Sandbox Application ID provided." ;;
            *) echo "::error::The configured Application ID does not look like a Square Sandbox ID."; exit 1 ;;
          esac

      - name: Compile Sandbox APK
        env:
          SQUARE_SANDBOX_APP_ID: ${{ secrets.SQUARE_SANDBOX_APP_ID }}
        run: |
          gradle --no-daemon :app:assembleDebug -PsquareSandboxAppId="$SQUARE_SANDBOX_APP_ID"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lauries-Creations-Square-Sandbox-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
