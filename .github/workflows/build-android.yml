name: Build Laurie Square Mobile POS (Sandbox)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Sandbox APK
        env:
          SQUARE_SANDBOX_APP_ID: ${{ secrets.SQUARE_SANDBOX_APP_ID }}
        run: |
          gradle --no-daemon :app:assembleDebug -PsquareSandboxAppId="$SQUARE_SANDBOX_APP_ID"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lauries-Creations-Square-Sandbox-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
