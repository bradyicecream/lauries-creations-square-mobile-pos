<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#593272"><title>Laurie’s Creations · Square catalog comparison</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f7f2fa;color:#23172a}.wrap{max-width:900px;margin:auto;padding:20px}h1{color:#593272}.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #0001}.status{font-weight:700}.muted{color:#6e6273}.item{border-top:1px solid #eee;padding:12px 0}.item:first-child{border-top:0}.pill{display:inline-block;background:#eee3f4;border-radius:999px;padding:4px 9px;margin:3px;font-size:12px}button,a.button{background:#593272;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:700;text-decoration:none;display:inline-block}button:disabled{opacity:.5}.error{color:#a0162b}</style></head><body><main class="wrap"><h1>Live Square catalog comparison</h1><p class="muted">Read-only view for O.P. Gallo Mobile. This page cannot change Square items or take production payments.</p><div class="card"><div id="status" class="status">Ready to load the live catalog.</div><p class="muted">You must first be signed in to the private Laurie’s Square OAuth dashboard in this browser.</p><button id="load">Load Square catalog</button> <a class="button" href="/">Back to private dashboard</a></div><div id="summary" class="card" hidden></div><div id="items" class="card" hidden></div></main><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('load').onclick=async()=>{const b=$('load');b.disabled=true;$('status').textContent='Loading from Square…';try{const r=await fetch('/api/square/catalog-readonly',{credentials:'same-origin',cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load catalog');const vars=(d.items||[]).reduce((n,x)=>n+(x.variations||[]).length,0);$('status').textContent='Live read-only catalog loaded.';$('summary').hidden=false;$('summary').innerHTML='<strong>'+esc(d.location.name)+'</strong><p>'+d.items.length+' items · '+vars+' variations · '+(d.modifierLists||[]).length+' modifier lists</p><p class="muted">Fetched '+esc(new Date(d.fetchedAt).toLocaleString())+'</p>';$('items').hidden=false;$('items').innerHTML='<h2>Square items</h2>'+d.items.map(x=>'<div class="item"><strong>'+esc(x.name)+'</strong><div>'+(x.variations||[]).map(v=>'<span class="pill">'+esc(v.name)+' · '+esc(v.price?.display||'No fixed price')+'</span>').join('')+'</div>'+(x.modifierListInfo?.length?'<small class="muted">'+x.modifierListInfo.length+' modifier set connection(s)</small>':'')+'</div>').join('');}catch(e){$('status').innerHTML='<span class="error">'+esc(e.message==='admin_authentication_required'?'Private sign-in required. Go back to the dashboard and sign in again.':e.message)+'</span>';}finally{b.disabled=false}};</script></body></html>
