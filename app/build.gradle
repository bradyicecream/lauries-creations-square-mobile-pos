plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Sandbox application ID only. NEVER put a real access token in Gradle or the repository.
def sandboxId = providers.gradleProperty('squareSandboxAppId').orElse('').get()
android {
    namespace 'com.lauriescreations.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'com.lauriescreations.mobile'
        minSdk 28
        targetSdk 35
        versionCode 7
        versionName '1.4.0-sandbox'
        buildConfigField 'String', 'SQUARE_SANDBOX_APP_ID', '"' + sandboxId.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            // OkHttp logging-interceptor and JSpecify both ship this Java 9 OSGi manifest.
            // It is not needed by the Android app and otherwise prevents mergeDebugJavaResource.
            excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        }
    }
}
dependencies {
    implementation 'com.squareup.sdk:mobile-payments-sdk:2.6.1'
    implementation 'com.squareup.sdk:mockreader-ui:2.6.1'
}
