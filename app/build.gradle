plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Two explicitly separated build environments. No Square access token is compiled into either APK.
def paymentEnvironment = providers.gradleProperty('paymentEnvironment').orElse('sandbox').get()
if (!(paymentEnvironment in ['sandbox','production'])) throw new GradleException('Unsupported payment environment')
def isProduction = paymentEnvironment == 'production'
def sandboxId = providers.gradleProperty('squareSandboxAppId').orElse('').get()
def productionId = providers.gradleProperty('squareProductionAppId').orElse('').get()
def appId = isProduction ? productionId : sandboxId
if (isProduction) {
    if (!productionId || productionId.startsWith('sandbox-'))
        throw new GradleException('A production Square Application ID is required.')
    def taskNames = gradle.startParameter.taskNames.collect { it.toLowerCase(java.util.Locale.ROOT) }
    if (taskNames.any { it.contains('debug') } || !taskNames.any { it.contains('release') })
        throw new GradleException('Production must be built as a signed release, never as debug.')
}
android {
    namespace 'com.lauriescreations.mobile'
    compileSdk 36
    defaultConfig {
        applicationId isProduction ? 'com.lauriescreations.mobile.production' : 'com.lauriescreations.mobile'
        minSdk 28
        targetSdk 35
        versionCode isProduction ? 1 : 15
        versionName isProduction ? '1.0.0-production' : '1.12.0-sandbox'
        buildConfigField 'String', 'SQUARE_SANDBOX_APP_ID', '"' + sandboxId.replace('\\', '\\\\').replace('"', '\\"') + '"'
        buildConfigField 'String', 'SQUARE_APP_ID', '"' + appId.replace('\\', '\\\\').replace('"', '\\"') + '"'
        buildConfigField 'boolean', 'IS_PRODUCTION', isProduction ? 'true' : 'false'
    }
    signingConfigs {
        production {
            if (isProduction) {
                def path = providers.gradleProperty('productionKeystorePath').orElse('').get()
                def storePass = providers.gradleProperty('productionStorePassword').orElse('').get()
                def alias = providers.gradleProperty('productionKeyAlias').orElse('').get()
                def keyPass = providers.gradleProperty('productionKeyPassword').orElse('').get()
                if (!path || !storePass || !alias || !keyPass)
                    throw new GradleException('Production signing properties are missing.')
                storeFile file(path)
                storePassword storePass
                keyAlias alias
                keyPassword keyPass
            }
        }
    }
    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            if (isProduction) signingConfig signingConfigs.production
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            // OkHttp logging-interceptor and JSpecify both ship this Java 9 OSGi manifest.
            // It is not needed by the Android app and otherwise prevents mergeDebugJavaResource.
            excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        }
    }
}
dependencies {
    implementation 'com.squareup.sdk:mobile-payments-sdk:2.6.1'
    implementation 'com.squareup.sdk:mockreader-ui:2.6.1'
}
